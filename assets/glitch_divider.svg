<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 12" width="800" height="12">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b2ff7;stop-opacity:0.1"/>
      <stop offset="20%" style="stop-color:#7b2ff7;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#ff006e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0);stop-opacity:0">
        <animate attributeName="offset" values="-0.3;1.3" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="10%" style="stop-color:rgba(255,255,255,0.7);stop-opacity:1">
        <animate attributeName="offset" values="-0.2;1.4" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="20%" style="stop-color:rgba(255,255,255,0);stop-opacity:0">
        <animate attributeName="offset" values="-0.1;1.5" dur="2.5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <style>
    @keyframes glitchShift {
      0%, 90%, 100% { transform: translateX(0); }
      92% { transform: translateX(3px); }
      94% { transform: translateX(-2px); }
      96% { transform: translateX(1px); }
    }
    .divider-line { animation: glitchShift 5s infinite; }
  </style>

  <!-- Main gradient line -->
  <g class="divider-line">
    <rect x="0" y="4" width="800" height="2" rx="1" fill="url(#divGrad)"/>
    <!-- Pulse sweep overlay -->
    <rect x="0" y="4" width="800" height="2" rx="1" fill="url(#pulseGrad)"/>
    <!-- Center diamond accent -->
    <rect x="396" y="1" width="8" height="8" rx="1" fill="#00d4ff" transform="rotate(45, 400, 5)"/>
  </g>

  <!-- Side dots -->
  <circle cx="60" cy="6" r="1.5" fill="#7b2ff7" opacity="0.6"/>
  <circle cx="740" cy="6" r="1.5" fill="#ff006e" opacity="0.6"/>
</svg>
