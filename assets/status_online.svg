<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 28" width="110" height="28">
  <style>
    @keyframes pulse {
      0%, 100% { r: 4; opacity: 1; }
      50% { r: 6; opacity: 0.6; }
    }
    @keyframes glowPulse {
      0%, 100% { r: 8; opacity: 0.3; }
      50% { r: 12; opacity: 0; }
    }
    .dot { animation: pulse 2s ease-in-out infinite; fill: #10b981; }
    .glow { animation: glowPulse 2s ease-in-out infinite; fill: #10b981; }
  </style>

  <rect x="0" y="0" width="110" height="28" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <circle class="glow" cx="18" cy="14" r="8"/>
  <circle class="dot" cx="18" cy="14" r="4"/>
  <text x="32" y="18.5" font-family="'Inter','SF Pro Display',sans-serif" font-size="12" font-weight="700" fill="#059669" letter-spacing="1.5">ONLINE</text>
</svg>
