<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2ff7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(0,212,255,0);stop-opacity:0" />
      <stop offset="50%" style="stop-color:rgba(0,212,255,0.08);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(0,212,255,0);stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes typing1 { 0%, 8% { width: 0; } 15%, 100% { width: 380px; } }
    @keyframes typing2 { 0%, 18% { width: 0; } 28%, 100% { width: 320px; } }
    @keyframes typing3 { 0%, 32% { width: 0; } 42%, 100% { width: 370px; } }
    @keyframes typing4 { 0%, 46% { width: 0; } 53%, 100% { width: 260px; } }
    @keyframes typing5 { 0%, 56% { width: 0; } 63%, 100% { width: 230px; } }
    @keyframes typing6 { 0%, 66% { width: 0; } 76%, 100% { width: 340px; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes scanline { 0% { transform: translateY(-40px); } 100% { transform: translateY(320px); } }
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes progressBar { 0%, 5% { width: 0; } 12% { width: 220px; } }
    @keyframes glitchFlicker { 0%, 92%, 94%, 96%, 100% { opacity: 1; } 93%, 95% { opacity: 0.7; } }

    .terminal-bg { fill: #f8f9fc; }
    .terminal-border { fill: none; stroke: url(#borderGrad); stroke-width: 2.5; rx: 12; }
    .header-bar { fill: #eef0f5; }
    .dot-red { fill: #ff5f57; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #28ca41; }

    .line { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; font-size: 13px; fill: #2d3748; }
    .prompt { fill: #7b2ff7; font-weight: bold; }
    .highlight { fill: #ff006e; font-weight: bold; }
    .cyan { fill: #0891b2; }
    .success { fill: #059669; font-weight: bold; }
    .comment { fill: #94a3b8; font-style: italic; }

    .line-mask { animation-fill-mode: forwards; animation-timing-function: steps(30, end); }
    .mask1 { animation: typing1 6s forwards; }
    .mask2 { animation: typing2 6s forwards; }
    .mask3 { animation: typing3 6s forwards; }
    .mask4 { animation: typing4 6s forwards; }
    .mask5 { animation: typing5 6s forwards; }
    .mask6 { animation: typing6 6s forwards; }

    .cursor { animation: blink 0.8s infinite; fill: #7b2ff7; }
    .scanline-bar { animation: scanline 3s linear infinite; opacity: 0.5; }
    .flicker { animation: glitchFlicker 4s infinite; }
    .progress-fill { animation: progressBar 6s forwards; fill: url(#borderGrad); }
  </style>

  <!-- Background -->
  <rect class="terminal-bg" width="800" height="320" rx="12"/>
  <rect class="terminal-border" x="1" y="1" width="798" height="318" rx="12"/>

  <!-- Title bar -->
  <rect class="header-bar" x="1" y="1" width="798" height="32" rx="12"/>
  <rect class="header-bar" x="1" y="20" width="798" height="13"/>
  <circle class="dot-red" cx="20" cy="17" r="5.5"/>
  <circle class="dot-yellow" cx="38" cy="17" r="5.5"/>
  <circle class="dot-green" cx="56" cy="17" r="5.5"/>
  <text x="400" y="21" text-anchor="middle" font-family="'Inter','SF Pro',sans-serif" font-size="11.5" fill="#64748b" font-weight="600">⚡ NEURAL_LINK v3.7.1 — secure_terminal</text>

  <!-- Scanline overlay -->
  <rect class="scanline-bar" x="0" y="0" width="800" height="40" fill="url(#scanGrad)"/>

  <!-- Progress bar background -->
  <rect x="30" y="50" width="220" height="8" rx="4" fill="#e2e8f0"/>
  <!-- Progress bar fill -->
  <rect class="progress-fill" x="30" y="50" width="0" height="8" rx="4"/>
  <text x="260" y="57" class="line comment" font-size="11">100% — SYSTEM INITIALIZED</text>

  <!-- Line 1 -->
  <clipPath id="clip1"><rect class="line-mask mask1" x="30" y="68" height="22"/></clipPath>
  <g clip-path="url(#clip1)">
    <text x="30" y="85" class="line">
      <tspan class="prompt">❯ </tspan>
      <tspan class="cyan">ACCESSING</tspan>
      <tspan> NEURAL DATABASE</tspan>
      <tspan class="comment"> ............... </tspan>
      <tspan class="success">OK</tspan>
    </text>
  </g>

  <!-- Line 2 -->
  <clipPath id="clip2"><rect class="line-mask mask2" x="30" y="98" height="22"/></clipPath>
  <g clip-path="url(#clip2)">
    <text x="30" y="115" class="line">
      <tspan class="prompt">❯ </tspan>
      <tspan class="cyan">SUBJECT FOUND:</tspan>
      <tspan class="highlight"> VŨ QUANG PHÚC</tspan>
    </text>
  </g>

  <!-- Line 3 -->
  <clipPath id="clip3"><rect class="line-mask mask3" x="30" y="128" height="22"/></clipPath>
  <g clip-path="url(#clip3)">
    <text x="30" y="145" class="line">
      <tspan class="prompt">❯ </tspan>
      <tspan class="cyan">CODENAME:</tspan>
      <tspan> lovecrushfamily</tspan>
      <tspan class="comment">  // handle verified ✓</tspan>
    </text>
  </g>

  <!-- Line 4 -->
  <clipPath id="clip4"><rect class="line-mask mask4" x="30" y="158" height="22"/></clipPath>
  <g clip-path="url(#clip4)">
    <text x="30" y="175" class="line">
      <tspan class="prompt">❯ </tspan>
      <tspan class="cyan">ORIGIN:</tspan>
      <tspan> Vietnam 🇻🇳</tspan>
    </text>
  </g>

  <!-- Line 5 -->
  <clipPath id="clip5"><rect class="line-mask mask5" x="30" y="188" height="22"/></clipPath>
  <g clip-path="url(#clip5)">
    <text x="30" y="205" class="line">
      <tspan class="prompt">❯ </tspan>
      <tspan class="cyan">STATUS:</tspan>
      <tspan class="success"> ██ ACTIVE ██</tspan>
    </text>
  </g>

  <!-- Line 6 -->
  <clipPath id="clip6"><rect class="line-mask mask6" x="30" y="218" height="22"/></clipPath>
  <g clip-path="url(#clip6)">
    <text x="30" y="235" class="line">
      <tspan class="prompt">❯ </tspan>
      <tspan class="cyan">CLEARANCE LEVEL:</tspan>
      <tspan class="highlight"> ∞ UNRESTRICTED</tspan>
    </text>
  </g>

  <!-- Blinking cursor -->
  <rect class="cursor" x="30" y="255" width="8" height="16" rx="1"/>
  <text x="46" y="268" class="line comment flicker">ready for input_</text>

  <!-- Bottom decorative line -->
  <line x1="30" y1="290" x2="770" y2="290" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="400" y="306" text-anchor="middle" font-family="'Inter','SF Pro',sans-serif" font-size="10" fill="#94a3b8">NEURAL_LINK://SECURE_CHANNEL — ENCRYPTED — SESSION #4E7F2A</text>
</svg>
